name: Fix stale campaign cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply stale campaign cleanup repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          sm = Path('src/campaign/campaign-state-machine.ts')
          text = sm.read_text()
          old = '  stopped: new Set(),'
          new = '  stopped: new Set(["cancelled"]),'
          if old not in text and new not in text:
              raise SystemExit('state-machine marker not found')
          if old in text:
              sm.write_text(text.replace(old, new, 1))

          tests = Path('tests/campaign-cancel-lifecycle.test.ts')
          text = tests.read_text()
          marker = 'stopped cancel releases a previously stopped campaign'
          if marker not in text:
              text += '''\n\ndescribe("stopped campaign cleanup", () => {\n  it("stopped cancel releases a previously stopped campaign", async () => {\n    const t = setup("stopped", null);\n    const result = await t.engine.requestCancel("cancel-test");\n    expect(result.status).toBe("cancelled");\n    expect(result.cancelRequested).toBe(true);\n    expect(result.stopRequested).toBe(false);\n  });\n});\n'''
              tests.write_text(text)

          for filename in ['package.json', 'package-lock.json']:
              path = Path(filename)
              data = json.loads(path.read_text())
              data['version'] = '0.9.4.5'
              if filename == 'package-lock.json' and isinstance(data.get('packages'), dict) and '' in data['packages']:
                  data['packages']['']['version'] = '0.9.4.5'
              path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')

          manifest = Path('manifest.json')
          data = json.loads(manifest.read_text())
          data['version'] = '0.9.4.5'
          manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n')
          PY
      - run: npm ci
      - run: npm run verify
      - name: Publish verified repair
        shell: bash
        run: |
          git rm .github/workflows/fix-stale-campaign-cleanup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: release stopped and stale campaigns in 0.9.4.5"
          git push origin main
