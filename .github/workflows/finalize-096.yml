name: finalize-096

on:
  push:
    branches: [feat/add-contacts-by-message-096]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/add-contacts-by-message-096
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Apply deterministic README patch
        run: node scripts/finalize-096.mjs
      - name: Commit README release section
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: document Flor Mia WhatsApp Sender 0.9.6"
          git push origin HEAD:feat/add-contacts-by-message-096
