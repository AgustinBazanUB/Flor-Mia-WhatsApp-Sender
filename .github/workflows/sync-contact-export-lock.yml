name: sync contact export dependency lock

on:
  push:
    branches: [feat/contact-export]

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Synchronize package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate package metadata
        run: node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if(p.version!=="0.9.5"||l.version!==p.version||l.packages?.[""]?.version!==p.version||!l.packages?.["node_modules/xlsx"]) throw new Error("contact export lock is not synchronized")'
      - name: Commit lock when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: sync xlsx dependency for contact export"
          git push origin HEAD:feat/contact-export
