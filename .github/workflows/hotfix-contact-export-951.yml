name: hotfix contact export 9.5.1 real session

on:
  push:
    branches: [feat/contact-export]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Apply hotfix
        run: python scripts/hotfix-contact-export-951.py
      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/contact-export/whatsapp-contact-adapter.ts tests/contact-export-adapter.test.ts tests/release-metadata.test.ts docs/contact-export-release-notes-9.5.1.md
          git commit -m "fix: continue scoped extraction through real virtual list viewport"
          git push origin HEAD:feat/contact-export
