name: patch 0.9.4 stable fingerprint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/patch-094-stable-fingerprint.mjs
      - name: Commit patch when changed
        shell: bash
        run: |
          if git diff --quiet -- src/whatsapp/conversation-context.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/whatsapp/conversation-context.ts
          git commit -m "fix: keep causal proof fingerprint stable across presence changes"
          git push origin HEAD:main
