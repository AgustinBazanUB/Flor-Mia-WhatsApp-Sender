name: patch 0.9.4 runtime

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/patch-094-runtime.mjs
      - name: Commit patch when changed
        shell: bash
        run: |
          if git diff --quiet -- src/engine/contact-engine.ts src/background/campaign-runtime.ts; then
            echo "Runtime patch already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/contact-engine.ts src/background/campaign-runtime.ts
          git commit -m "fix: bound proof retries and make resume idempotent"
          git push origin HEAD:main
