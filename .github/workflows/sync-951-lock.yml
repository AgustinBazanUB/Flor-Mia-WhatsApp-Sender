name: sync 9.5.1 release lock

on:
  push:
    branches: [feat/contact-export]

permissions:
  contents: write

jobs:
  sync-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Synchronize lock metadata
        run: npm install --package-lock-only --ignore-scripts
      - name: Validate 9.5.1 metadata
        run: node -e 'const p=require("./package.json"),l=require("./package-lock.json"); if(p.version!=="9.5.1"||l.version!==p.version||l.packages?.[""]?.version!==p.version) throw new Error("9.5.1 metadata mismatch")'
      - name: Commit synchronized lock
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync package lock 9.5.1"
          git push origin HEAD:feat/contact-export
