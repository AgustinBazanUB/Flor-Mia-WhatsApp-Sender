name: WhatsApp Inbox Hardening

on:
  push:
    branches:
      - feature/whatsapp-inbox-crm-096
      - fix/whatsapp-inbox-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint full extension
        run: npm run lint

      - name: Focused Inbox tests
        run: npx vitest run tests/inbox-protocol.test.ts

      - name: Full extension tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Validate packaged build
        run: npm run validate:build
