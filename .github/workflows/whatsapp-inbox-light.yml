name: WhatsApp Inbox Light

on:
  push:
    branches:
      - feature/whatsapp-inbox-crm-096
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-light:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint Inbox files
        run: >-
          npx eslint
          src/shared/inbox-protocol.ts
          src/whatsapp/inbox-adapter.ts
          src/background/inbox-service-worker.ts
          src/content/inbox-runtime.ts
          src/content/inbox-web-app-bridge.ts
          tests/inbox-protocol.test.ts

      - name: Focused Inbox tests
        run: npx vitest run tests/inbox-protocol.test.ts

      - name: Build extension
        run: npm run build

      - name: Validate packaged build
        run: npm run validate:build
