name: Release 0.9.4.2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/release-0942.yml

permissions:
  contents: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update release metadata
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '0.9.4.2';
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          manifest.version = version;
          manifest.version_name = version;
          fs.writeFileSync('manifest.json', JSON.stringify(manifest, null, 2) + '\n');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n');
          NODE
      - name: Install dependencies
        run: npm ci
      - name: Verify release tree
        run: npm run verify
      - name: Verify generated manifest version
        run: node -e "const m=require('./dist/manifest.json'); if(m.version!=='0.9.4.2') process.exit(1); console.log(m.version)"
      - name: Publish release metadata and remove one-shot workflow
        run: |
          rm .github/workflows/release-0942.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json package.json package-lock.json .github/workflows/release-0942.yml
          git commit -m "chore: release 0.9.4.2"
          git push origin HEAD:main
