name: Hotfix media to text transition

on:
  push:
    branches:
      - feat/campaign-recipient-confirmation-sync
    paths:
      - ".github/workflows/hotfix-media-text-transition.yml"

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted WhatsApp media-to-text fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path_name, old, new):
              path = Path(path_name)
              text = path.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one match in {path_name}: {old[:80]!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          # 1) Give WhatsApp a bounded settle window after confirmed media before text.
          replace_once(
              "src/background/contact-adapter.ts",
              'const IMAGE_CONFIRMATION_BUDGET_MS = 8_000;\n',
              'const IMAGE_CONFIRMATION_BUDGET_MS = 8_000;\nconst POST_MEDIA_TEXT_SETTLE_MS = 1_500;\n'
          )
          replace_once(
              "src/background/contact-adapter.ts",
              'async function waitForImageSettle(delayMs: number, signal?: AbortSignal): Promise<void> {',
              'async function waitForUiSettle(delayMs: number, signal?: AbortSignal): Promise<void> {'
          )
          replace_once(
              "src/background/contact-adapter.ts",
              '      await waitForImageSettle(settleDelayMs, context.signal);',
              '      await waitForUiSettle(settleDelayMs, context.signal);'
          )
          replace_once(
              "src/background/contact-adapter.ts",
              '  async sendText(step: TextContactStep, context: StepExecutionContext): Promise<StepExecutionResult> {\n    try {\n      const result = await this.transport.send(INTERNAL_MESSAGE_TYPES.whatsappSendText, {',
              '  async sendText(step: TextContactStep, context: StepExecutionContext): Promise<StepExecutionResult> {\n    const settleDelayMs = context.checkpoint.lastConfirmedStepId?.startsWith("image-")\n      ? POST_MEDIA_TEXT_SETTLE_MS\n      : 0;\n    try {\n      if (settleDelayMs > 0) await waitForUiSettle(settleDelayMs, context.signal);\n      const result = await this.transport.send(INTERNAL_MESSAGE_TYPES.whatsappSendText, {'
          )
          replace_once(
              "src/background/contact-adapter.ts",
              '      const details = {\n        verificationOutcome: result.verification.outcome,',
              '      const details = {\n        postMediaTextSettleMs: settleDelayMs,\n        verificationOutcome: result.verification.outcome,'
          )
          replace_once(
              "src/background/contact-adapter.ts",
              '    } catch (error) {\n      return executionError(error);\n    }\n  }\n\n  async reconcile(step: ContactStep, context: StepExecutionContext): Promise<StepReconciliationResult> {',
              '    } catch (error) {\n      const normalized = toExtensionError(error);\n      return executionError(new ExtensionError(normalized.code, normalized.message, {\n        recoverable: normalized.recoverable,\n        cause: error,\n        details: { ...(normalized.details ?? {}), postMediaTextSettleMs: settleDelayMs }\n      }));\n    }\n  }\n\n  async reconcile(step: ContactStep, context: StepExecutionContext): Promise<StepReconciliationResult> {'
          )

          # 2) If the composer still shows transient UI residue, wait briefly; never erase it.
          replace_once(
              "src/whatsapp/send-text.ts",
              'const STRONG_ID_GRACE_MS = 100;\n',
              'const STRONG_ID_GRACE_MS = 100;\nconst TRANSIENT_COMPOSER_CONFLICT_GRACE_MS = 1_200;\n'
          )
          replace_once(
              "src/whatsapp/send-text.ts",
              'function classifyComposerElementContent(composer: HTMLElement, expectedText: string): ComposerPreparationState {\n  const expected = normalizeComposerLineEndings(expectedText);\n  const representations = composerTextRepresentations(composer);\n  if (representations.some((value) => value === expected)) return "prepared";\n  if (representations.every((value) => !canonicalMessageText(value).trim())) return "empty";\n  return "conflict";\n}\n',
              'function classifyComposerElementContent(composer: HTMLElement, expectedText: string): ComposerPreparationState {\n  const expected = normalizeComposerLineEndings(expectedText);\n  const representations = composerTextRepresentations(composer);\n  if (representations.some((value) => value === expected)) return "prepared";\n  if (representations.every((value) => !canonicalMessageText(value).trim())) return "empty";\n  return "conflict";\n}\n\nasync function waitForComposerConflictToSettle(\n  expectedText: string,\n  fallbackComposer: HTMLElement,\n  timeoutMs = TRANSIENT_COMPOSER_CONFLICT_GRACE_MS\n): Promise<{ element: HTMLElement; state: Exclude<ComposerPreparationState, "conflict"> } | null> {\n  return waitForCondition(() => {\n    const live = findComposer()?.element ?? (fallbackComposer.isConnected ? fallbackComposer : null);\n    if (!live) return null;\n    const state = classifyComposerElementContent(live, expectedText);\n    return state === "conflict" ? null : { element: live, state };\n  }, { timeoutMs, description: "que WhatsApp termine de estabilizar el composer después del contenido multimedia" }).catch(() => null);\n}\n'
          )
          replace_once(
              "src/whatsapp/send-text.ts",
              'export async function prepareComposerTextForSend(composer: HTMLElement, message: string): Promise<"inserted" | "reused"> {\n  const expected = normalizeComposerLineEndings(message);\n  const state = classifyComposerElementContent(composer, expected);\n  if (state === "prepared") return "reused";\n  if (state === "conflict") {\n    throw new ExtensionError(ERROR_CODES.invalidInput, "La conversación tiene un borrador diferente. Vacialo manualmente antes de continuar para no sobrescribirlo.", {\n      recoverable: true, details: { sendAttempted: false, draftConflict: true }\n    });\n  }\n  composer.focus();\n  const selection = window.getSelection();\n  const range = document.createRange();\n  range.selectNodeContents(composer);\n  selection?.removeAllRanges();\n  selection?.addRange(range);\n  const inserted = typeof document.execCommand === "function" && document.execCommand("insertText", false, expected);\n  let prepared = await waitForPreparedComposer(expected, composer, inserted ? 800 : 50);',
              'export async function prepareComposerTextForSend(composer: HTMLElement, message: string): Promise<"inserted" | "reused"> {\n  const expected = normalizeComposerLineEndings(message);\n  let activeComposer = composer;\n  let state = classifyComposerElementContent(activeComposer, expected);\n  if (state === "conflict") {\n    const settled = await waitForComposerConflictToSettle(expected, activeComposer);\n    if (settled) {\n      activeComposer = settled.element;\n      state = settled.state;\n    }\n  }\n  if (state === "prepared") return "reused";\n  if (state === "conflict") {\n    throw new ExtensionError(ERROR_CODES.invalidInput, "La conversación tiene un borrador diferente. Vacialo manualmente antes de continuar para no sobrescribirlo.", {\n      recoverable: true,\n      details: { sendAttempted: false, draftConflict: true, conflictGraceMs: TRANSIENT_COMPOSER_CONFLICT_GRACE_MS }\n    });\n  }\n  activeComposer.focus();\n  const selection = window.getSelection();\n  const range = document.createRange();\n  range.selectNodeContents(activeComposer);\n  selection?.removeAllRanges();\n  selection?.addRange(range);\n  const inserted = typeof document.execCommand === "function" && document.execCommand("insertText", false, expected);\n  let prepared = await waitForPreparedComposer(expected, activeComposer, inserted ? 800 : 50);'
          )

          # 3) Regression test for the transient composer residue from the supplied incident.
          send_text_test = Path("tests/send-text.test.ts")
          text = send_text_test.read_text(encoding="utf-8")
          anchor = '''  it("preserves a different user draft and never clicks", async () => {\n'''
          addition = '''  it("waits for transient post-media composer residue before preparing campaign text", async () => {\n    const composer = document.querySelector<HTMLElement>("[contenteditable='true']")!;\n    composer.textContent = "residuo transitorio de la UI";\n    window.setTimeout(() => { composer.textContent = ""; }, 25);\n    document.querySelector("button")!.addEventListener("click", () => appendOutgoing(composerText(), "true_after_media"));\n    const result = await sendAndVerifyText({\n      operationId: "after-media-residue",\n      phoneDigits: "5491112345678",\n      message: "Mensaje campaña",\n      timeoutMs: 250\n    });\n    expect(result.verification).toMatchObject({\n      confirmed: true,\n      outcome: "confirmed_strong",\n      messageElementId: "true_after_media"\n    });\n  });\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit("Could not place transient composer regression test")
          send_text_test.write_text(text.replace(anchor, addition + anchor, 1), encoding="utf-8")

          # 4) Adapter regression: after a confirmed image, text is not dispatched for 1.5 seconds.
          Path("tests/contact-adapter-text-after-media-settle.test.ts").write_text(r'''import { afterEach, describe, expect, it, vi } from "vitest";
          import { ChromeWhatsAppContactAdapter } from "../src/background/contact-adapter";
          import { INTERNAL_MESSAGE_TYPES } from "../src/shared/protocol";
          import type { StepExecutionContext, TextContactStep } from "../src/engine/types";

          function textStep(): TextContactStep {
            return {
              id: "text",
              operationId: "campaign:contact:text",
              position: 4,
              kind: "text",
              status: "in_progress",
              attempts: 1,
              text: "Hola desde Flor Mía"
            };
          }

          function executionContext(): StepExecutionContext {
            return {
              checkpoint: {
                schemaVersion: 1,
                checkpointId: "checkpoint",
                campaignId: "campaign",
                campaignName: "Campaign",
                contact: {
                  contactId: "contact",
                  phoneDigits: "5491112345678",
                  maskedPhone: "+54*******5678"
                },
                steps: [],
                status: "running",
                currentStepId: "text",
                lastConfirmedStepId: "image-3",
                openConversationAttempts: 1,
                createdAt: new Date(0).toISOString(),
                updatedAt: new Date(0).toISOString(),
                history: []
              },
              timeoutMs: 30_000,
              imageLoadTimeoutMs: 15_000,
              previewTimeoutMs: 20_000
            };
          }

          afterEach(() => {
            vi.useRealTimers();
          });

          describe("post-media text settle", () => {
            it("waits 1.5 seconds after the last confirmed image before dispatching text", async () => {
              vi.useFakeTimers();
              const send = vi.fn().mockResolvedValue({
                success: true,
                completedAt: new Date(0).toISOString(),
                verification: {
                  sent: true,
                  confirmed: true,
                  outcome: "confirmed_strong",
                  confidence: "strong",
                  method: "test-text-proof",
                  observedAt: new Date(0).toISOString()
                }
              });
              const adapter = new ChromeWhatsAppContactAdapter({ getImage: vi.fn() } as never, { send } as never, null, null);
              (adapter as unknown as { whatsappTabId: number | null }).whatsappTabId = 7;

              const pending = adapter.sendText(textStep(), executionContext());
              await Promise.resolve();
              await vi.advanceTimersByTimeAsync(1_499);
              expect(send).not.toHaveBeenCalled();

              await vi.advanceTimersByTimeAsync(1);
              const result = await pending;
              expect(send).toHaveBeenCalledTimes(1);
              expect(send.mock.calls[0]?.[0]).toBe(INTERNAL_MESSAGE_TYPES.whatsappSendText);
              expect(result).toMatchObject({
                outcome: "confirmed",
                verification: { details: { postMediaTextSettleMs: 1_500 } }
              });
            });
          });
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")

          # 5) Version this behavior as 0.9.7.
          replace_once("package.json", '"version": "0.9.6"', '"version": "0.9.7"')
          lock = Path("package-lock.json")
          lock_text = lock.read_text(encoding="utf-8")
          if lock_text.count('"version": "0.9.6"') < 2:
              raise SystemExit("package-lock root version markers not found")
          lock.write_text(lock_text.replace('"version": "0.9.6"', '"version": "0.9.7"', 2), encoding="utf-8")
          replace_once("manifest.json", '"version": "0.9.6",\n  "version_name": "0.9.6"', '"version": "0.9.7",\n  "version_name": "0.9.7"')

          readme = Path("README.md")
          readme_text = readme.read_text(encoding="utf-8")
          marker = "## Contactos de WhatsApp — 0.9.6\n"
          release_note = "## Sender de campañas — 0.9.7\n\nLa 0.9.7 endurece la transición **última imagen → texto** observada en WhatsApp Web: después de una imagen confirmada espera 1,5 s antes de despachar el texto y, si el composer muestra contenido transitorio de la UI, espera hasta 1,2 s a que se estabilice. Un borrador de usuario que persiste se sigue preservando y bloquea el envío; no se borra ni se sobrescribe.\n\n"
          if readme_text.count(marker) != 1:
              raise SystemExit("README 0.9.6 marker not found")
          readme.write_text(readme_text.replace(marker, release_note + marker, 1), encoding="utf-8")
          PY

      - name: Remove one-shot workflow from final branch state
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hotfix-media-text-transition.yml

      - name: Install
        run: npm ci

      - name: Verify full extension
        run: npm run verify

      - name: Commit verified hotfix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: stabilize media-to-text campaign transition"
          git push origin HEAD:feat/campaign-recipient-confirmation-sync
