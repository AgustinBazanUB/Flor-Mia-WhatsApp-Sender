name: Hotfix media to text transition retry

on:
  push:
    branches:
      - feat/campaign-recipient-confirmation-sync
    paths:
      - ".github/workflows/hotfix-media-text-transition-retry.yml"

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reuse exact previously tested patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/hotfix-media-text-transition.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          code = textwrap.dedent(workflow[start:end])
          exec(compile(code, 'media-text-hotfix.py', 'exec'), {'__name__': '__main__'})
          PY

      - name: Remove one-shot workflows
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/hotfix-media-text-transition.yml
          rm .github/workflows/hotfix-media-text-transition-retry.yml

      - name: Install
        run: npm ci

      - name: Verify full extension
        run: npm run verify

      - name: Commit verified 0.9.7
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: stabilize media-to-text campaign transition"
          git push origin HEAD:feat/campaign-recipient-confirmation-sync
