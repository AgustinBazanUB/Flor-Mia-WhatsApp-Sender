name: patch 0.9.4 open failure budget

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/patch-094-open-failure-budget.mjs
      - name: Commit patch when changed
        shell: bash
        run: |
          if git diff --quiet -- src/engine/contact-engine.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/engine/contact-engine.ts
          git commit -m "fix: budget failed conversation proofs without blocking reconciliation"
          git push origin HEAD:main
