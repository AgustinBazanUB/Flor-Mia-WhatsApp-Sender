name: run-0.9.4.3-post-click

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply and verify
        id: work
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p0-0943.log
          {
            python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p0-0943-apply.yml').read_text()
          anchor = source.index('      - name: Apply P0 post-click repair')
          start = source.index('        run: |\n', anchor) + len('        run: |\n')
          end = source.index('      - name: Install', start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-p0.sh').write_text('\n'.join(lines) + '\n')
          PY
            bash /tmp/apply-p0.sh
            python3 - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p=Path(path); s=p.read_text()
              if old not in s: raise SystemExit(f'missing hardening marker in {path}: {old[:100]!r}')
              p.write_text(s.replace(old,new,1))

          # Backward compatibility for internal/mocked 0.9.4.2 TextVerification responses.
          patch('src/background/contact-adapter.ts',
          '''      if (!result.success || result.verification.sent !== true) {\n        throw new ExtensionError(ERROR_CODES.verificationFailed, "WhatsApp no confirmó la ejecución del envío de texto.");\n      }''',
          '''      const sentExecuted = result.verification.sent === true || result.verification.confirmed === true;\n      if (!result.success || !sentExecuted) {\n        throw new ExtensionError(ERROR_CODES.verificationFailed, "WhatsApp no confirmó la ejecución del envío de texto.");\n      }''')

          # Never observe document.body: a valid proved conversation must have #main.
          patch('src/whatsapp/send-text.ts',
          '''function messageRoot(): HTMLElement {\n  return document.querySelector<HTMLElement>("#main [data-testid='conversation-panel-messages']")\n    ?? document.getElementById("main")\n    ?? document.body;\n}''',
          '''function messageRoot(): HTMLElement {\n  const root = document.querySelector<HTMLElement>("#main [data-testid='conversation-panel-messages']")\n    ?? document.getElementById("main");\n  if (!root) {\n    throw new ExtensionError(ERROR_CODES.verificationFailed, "WhatsApp perdió el contenedor de la conversación antes del envío.", {\n      recoverable: true, details: { sendAttempted: false }\n    });\n  }\n  return root;\n}''')

          # The post-click budget starts at click time, not while persisting the pre-click checkpoint.
          patch('src/whatsapp/send-text.ts',
          '''  let causalTimer: ReturnType<typeof setTimeout> | null = null;\n  let resolveWait!: (value: ObserverOutcome) => void;''',
          '''  let causalTimer: ReturnType<typeof setTimeout> | null = null;\n  let timeoutTimer: ReturnType<typeof setTimeout> | null = null;\n  let resolveWait!: (value: ObserverOutcome) => void;''')
          patch('src/whatsapp/send-text.ts',
          '''    observer.disconnect();\n    globalThis.clearTimeout(timeoutTimer);\n    if (causalTimer) globalThis.clearTimeout(causalTimer);''',
          '''    observer.disconnect();\n    if (timeoutTimer) globalThis.clearTimeout(timeoutTimer);\n    if (causalTimer) globalThis.clearTimeout(causalTimer);''')
          old='''  const timeoutTimer = globalThis.setTimeout(() => {\n    if (!clicked || settled) return;\n    try { requireConversationContext(input.expectedPhoneDigits); } catch (error) { failAfterClick(error); return; }\n    finish(metrics("unverified"));\n  }, budget);\n\n  return {\n    baselineIds: [...baselineIds],\n    markClicked: () => {\n      observer.takeRecords();\n      clicked = true;\n      sendClickAtMs = Date.now();\n      sendClickAt = new Date(sendClickAtMs).toISOString();\n    },'''
          new='''  return {\n    baselineIds: [...baselineIds],\n    markClicked: () => {\n      observer.takeRecords();\n      clicked = true;\n      sendClickAtMs = Date.now();\n      sendClickAt = new Date(sendClickAtMs).toISOString();\n      timeoutTimer = globalThis.setTimeout(() => {\n        if (settled) return;\n        try { requireConversationContext(input.expectedPhoneDigits); } catch (error) { failAfterClick(error); return; }\n        finish(metrics("unverified"));\n      }, budget);\n    },'''
          patch('src/whatsapp/send-text.ts', old, new)
          PY
            npm ci
            npm run verify
            node -e "const m=require('./dist/manifest.json'); if(m.version!=='0.9.4.3') process.exit(1); console.log('dist',m.version)"
          } 2>&1 | tee /tmp/p0-0943.log
      - name: Commit repaired release
        if: steps.work.outcome == 'success'
        shell: bash
        run: |
          git rm .github/workflows/p0-0943-apply.yml .github/workflows/p0-0943-run.yml
          git rm -f .p0-0943-debug.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm post-click sends safely in 0.9.4.3"
          git push origin main
      - name: Publish failure diagnostics only
        if: steps.work.outcome != 'success'
        shell: bash
        run: |
          git reset --hard HEAD
          tail -n 260 /tmp/p0-0943.log > .p0-0943-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .p0-0943-debug.txt
          git commit -m "chore: capture 0.9.4.3 apply failure"
          git push origin main
          exit 1
