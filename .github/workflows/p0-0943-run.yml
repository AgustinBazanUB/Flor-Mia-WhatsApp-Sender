name: run-0.9.4.3-post-click

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply and verify
        id: work
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          : > /tmp/p0-0943.log
          {
            python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p0-0943-apply.yml').read_text()
          anchor = source.index('      - name: Apply P0 post-click repair')
          start = source.index('        run: |\n', anchor) + len('        run: |\n')
          end = source.index('      - name: Install', start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-p0.sh').write_text('\n'.join(lines) + '\n')
          PY
            bash /tmp/apply-p0.sh
            npm ci
            npm run verify
            node -e "const m=require('./dist/manifest.json'); if(m.version!=='0.9.4.3') process.exit(1); console.log('dist',m.version)"
          } 2>&1 | tee /tmp/p0-0943.log
      - name: Commit repaired release
        if: steps.work.outcome == 'success'
        shell: bash
        run: |
          git rm .github/workflows/p0-0943-apply.yml .github/workflows/p0-0943-run.yml
          git rm -f .p0-0943-debug.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm post-click sends safely in 0.9.4.3"
          git push origin main
      - name: Publish failure diagnostics only
        if: steps.work.outcome != 'success'
        shell: bash
        run: |
          git reset --hard HEAD
          tail -n 240 /tmp/p0-0943.log > .p0-0943-debug.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .p0-0943-debug.txt
          git commit -m "chore: capture 0.9.4.3 apply failure"
          git push origin main
          exit 1
