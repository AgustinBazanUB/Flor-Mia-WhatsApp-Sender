name: run-0.9.4.3-post-click

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Execute staged patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/p0-0943-apply.yml').read_text()
          anchor = source.index('      - name: Apply P0 post-click repair')
          start = source.index('        run: |\n', anchor) + len('        run: |\n')
          end = source.index('      - name: Install', start)
          block = source[start:end]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          Path('/tmp/apply-p0.sh').write_text('\n'.join(lines) + '\n')
          PY
          bash /tmp/apply-p0.sh
      - name: Install
        run: npm ci
      - name: Verify
        run: npm run verify
      - name: Confirm release metadata
        run: node -e "const m=require('./dist/manifest.json'); if(m.version!=='0.9.4.3') process.exit(1); console.log('dist',m.version)"
      - name: Commit
        shell: bash
        run: |
          git rm .github/workflows/p0-0943-apply.yml .github/workflows/p0-0943-run.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: confirm post-click sends safely in 0.9.4.3"
          git push origin main
