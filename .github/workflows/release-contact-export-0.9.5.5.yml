name: release contact export 0.9.5.5

on:
  push:
    branches:
      - feat/contact-export

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/contact-export
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Fix patch runner compatibility
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/release-0.9.5.5.py')
          text = p.read_text(encoding='utf-8')
          old = "updated, count = re.subn(pattern, replacement, content, count=1, flags=re.S)"
          new = "updated, count = re.subn(pattern, lambda _match: replacement, content, count=1, flags=re.S)"
          if old not in text:
              raise SystemExit('regex_once implementation not found')
          text = text.replace(old, new, 1)
          text = text.replace(
              'resolver estructurado local de etiquetas/LID de 0.9.5.3.',
              'resolver estructurado local de etiquetas/LID de 0.9.5.5.',
              1
          )
          p.write_text(text, encoding='utf-8')
          PY
      - name: Apply 0.9.5.5 patch
        run: python scripts/release-0.9.5.5.py
      - name: Install locked dependencies
        run: npm ci
      - name: Verify before commit
        run: npm run verify
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests manifest.json package.json package-lock.json scripts/validate-build.mjs README.md docs/whatsapp-contact-export.md docs/contact-export-release-notes-0.9.5.5.md
          git commit -m "fix: resolve labeled LID phones without visual chats in 0.9.5.5"
          git push origin HEAD:feat/contact-export
