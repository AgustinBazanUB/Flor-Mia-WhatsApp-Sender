name: patch contact export content

on:
  push:
    branches: [feat/contact-export]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/patch-contact-export-content.mjs
      - name: Commit WhatsApp content patch
        shell: bash
        run: |
          if git diff --quiet -- src/content/whatsapp.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/whatsapp.ts
          git commit -m "feat: collect labeled WhatsApp contacts locally"
          git push origin HEAD:feat/contact-export
