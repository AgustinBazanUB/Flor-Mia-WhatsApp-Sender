name: release contact export 0.9.5.2

on:
  push:
    branches:
      - feat/contact-export

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/contact-export
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Apply 0.9.5.2 patch
        run: python scripts/release-0.9.5.2.py
      - name: Complete diagnostic initialization
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/background/contact-export-runtime.ts')
          s = p.read_text(encoding='utf-8')
          s = s.replace('          stack: null,\n          updatedAt: new Date().toISOString()', '          stack: null,\n          technicalDetails: {},\n          updatedAt: new Date().toISOString()')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: Verify before commit
        run: npm run verify
      - name: Commit release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests manifest.json package.json package-lock.json scripts/validate-build.mjs README.md docs/contact-export-release-notes-0.9.5.2.md
          git commit -m "fix: select the real filtered label list in 0.9.5.2"
          git push origin HEAD:feat/contact-export
