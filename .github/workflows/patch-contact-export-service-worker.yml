name: patch contact export service worker

on:
  push:
    branches: [feat/contact-export]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: node scripts/patch-contact-export-service-worker.mjs
      - name: Commit service worker patch
        shell: bash
        run: |
          if git diff --quiet -- src/background/service-worker.ts; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/service-worker.ts
          git commit -m "feat: orchestrate contact export outside sender runtime"
          git push origin HEAD:feat/contact-export
