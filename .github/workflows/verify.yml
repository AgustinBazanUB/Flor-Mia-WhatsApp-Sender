name: verify

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  publish-p0-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Publish verified P0 repair with phase tracing
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          post() {
            state="$1"; phase="$2"; desc="$3"
            payload=$(jq -n --arg state "$state" --arg context "p0/publish-$phase" --arg description "$desc" '{state:$state,context:$context,description:$description}')
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
              --data "$payload" >/dev/null
          }
          fail() {
            phase="$1"; code="$2"
            post failure "$phase" "P0 publish failed at $phase"
            exit "$code"
          }

          post pending start "P0 publish started"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 scripts/apply-p0-text.py || fail patch $?
          python3 scripts/fix-p0-test-tab-type.py || fail patch $?
          post success patch "Verified patch applied"

          git add src/background/whatsapp-transport.ts src/background/contact-adapter.ts src/background/service-worker.ts src/compatibility/types.ts src/whatsapp/preflight.ts src/engine/retry-policy.ts
          git commit -m "fix: synchronize WhatsApp post-navigation handshake" || fail commit-core $?
          git add tests/contact-adapter-binding.test.ts tests/post-navigation-handshake.test.ts
          git commit -m "test: cover post-navigation content lifecycle" || fail commit-tests $?
          git add manifest.json package.json package-lock.json
          git commit -m "chore: release 0.9.4.1" || fail commit-version $?
          post success commits "Logical product commits created"

          git show 95b65f2714a447e73051906ddf413a0f583d2ca9:.github/workflows/verify.yml > .github/workflows/verify.yml || fail cleanup $?
          git rm scripts/apply-p0-handshake-fix.mjs scripts/apply-p0-text.py scripts/fix-p0-test-tab-type.py .github/workflows/p0-handshake-fix.yml || fail cleanup $?
          git add .github/workflows/verify.yml
          git commit -m "chore: remove one-shot handshake repair helper" || fail cleanup $?
          post success cleanup "Normal CI restored and helpers removed"

          post pending npm-ci "Installing locked dependencies"
          npm ci --no-audit --no-fund || fail npm-ci $?
          post success npm-ci "npm ci passed"

          post pending verify "Running npm run verify"
          npm run verify || fail verify $?
          post success verify "npm run verify passed"

          node -e 'const m=require("./dist/manifest.json"); if(m.version!=="0.9.4.1"){console.error(`expected 0.9.4.1 got ${m.version}`);process.exit(1)}; console.log(`dist version=${m.version}`)' || fail dist-version $?
          post success dist-version "dist manifest is 0.9.4.1"

          git push origin HEAD:main || fail push $?
          post success push "Verified commits pushed to main"
          post success start "P0 publish completed"
