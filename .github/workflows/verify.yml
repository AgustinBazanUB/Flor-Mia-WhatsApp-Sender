name: verify

on:
  push:
    branches: [main]

permissions:
  statuses: write

jobs:
  diagnose-p0-line:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Patch and publish line 278
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          post() {
            state="$1"; context="$2"; desc="$3"
            payload=$(jq -n --arg state "$state" --arg context "$context" --arg description "$desc" '{state:$state,context:$context,description:$description}')
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
              --data "$payload" >/dev/null
          }
          post pending p0/line-start "Inspecting patched contact-adapter line"
          python3 scripts/apply-p0-text.py
          for n in 276 277 278 279 280; do
            text=$(sed -n "${n}p" src/background/contact-adapter.ts)
            slug=$(printf '%s' "$text" | tr ' /,:()[]`"' '------------' | tr -cd 'A-Za-z0-9_.?-' | cut -c1-90)
            post success "p0/line-${n}-${slug}" "line $n: $slug"
          done
          post success p0/line-start "Patched line inspection complete"
