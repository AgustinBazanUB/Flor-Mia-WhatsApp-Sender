name: verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-p0-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply P0 lifecycle fix
        run: |
          node scripts/apply-p0-handshake-fix.mjs core
          git add src/background/whatsapp-transport.ts src/background/contact-adapter.ts src/background/service-worker.ts src/compatibility/types.ts src/whatsapp/preflight.ts src/engine/retry-policy.ts
          git commit -m "fix: synchronize WhatsApp post-navigation handshake"
      - name: Add P0 regression tests
        run: |
          node scripts/apply-p0-handshake-fix.mjs tests
          git add tests/contact-adapter-binding.test.ts tests/post-navigation-handshake.test.ts
          git commit -m "test: cover post-navigation content lifecycle"
      - name: Set extension version 0.9.4.1
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const update = (path, mutate) => {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            mutate(value);
            fs.writeFileSync(path, JSON.stringify(value, null, 2) + '\n');
          };
          update('manifest.json', (m) => { m.version = '0.9.4.1'; m.version_name = '0.9.4.1'; });
          update('package.json', (p) => { p.version = '0.9.4.1'; });
          update('package-lock.json', (p) => {
            p.version = '0.9.4.1';
            if (p.packages && p.packages['']) p.packages[''].version = '0.9.4.1';
          });
          NODE
          git add manifest.json package.json package-lock.json
          git commit -m "chore: release 0.9.4.1"
      - name: Restore normal verification workflow and clean helpers
        run: |
          git show 95b65f2714a447e73051906ddf413a0f583d2ca9:.github/workflows/verify.yml > .github/workflows/verify.yml
          git rm scripts/apply-p0-handshake-fix.mjs .github/workflows/p0-handshake-fix.yml
          git add .github/workflows/verify.yml
          git commit -m "chore: remove one-shot handshake repair helper"
      - name: Push final tree to main
        run: git push origin HEAD:main
