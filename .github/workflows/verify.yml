name: verify

on:
  push:
    branches: [main]

permissions:
  statuses: write

jobs:
  diagnose-p0-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Patch and report verbose failing test output
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          post() {
            state="$1"; context="$2"; desc="$3"
            payload=$(jq -n --arg state "$state" --arg context "$context" --arg description "$desc" '{state:$state,context:$context,description:$description}')
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
              --data "$payload" >/dev/null
          }
          slugify() {
            printf '%s' "$1" | sed -E 's/\x1B\[[0-9;]*[mK]//g' | tr ' /,:()[]`"' '------------' | tr -cd 'A-Za-z0-9_.<>=+-' | cut -c1-100
          }
          post pending p0/tests-start "P0 test diagnostic started"
          python3 scripts/apply-p0-text.py
          python3 scripts/fix-p0-test-tab-type.py
          git show 95b65f2714a447e73051906ddf413a0f583d2ca9:.github/workflows/verify.yml > .github/workflows/verify.yml
          rm -f scripts/apply-p0-handshake-fix.mjs scripts/apply-p0-text.py scripts/fix-p0-test-tab-type.py .github/workflows/p0-handshake-fix.yml
          npm ci --no-audit --no-fund >/tmp/npm-ci.log 2>&1
          set +e
          npm test -- --reporter=verbose >/tmp/tests.log 2>&1
          code=$?
          set -e
          cat /tmp/tests.log
          if [ "$code" -eq 0 ]; then
            post success p0/tests-result "Vitest passed"
            post success p0/tests-start "P0 tests completed"
            exit 0
          fi
          mapfile -t lines < <(grep -E 'FAIL|×|AssertionError|Error:|expected|Received|Timed out|timeout' /tmp/tests.log | tail -n 8)
          idx=0
          for line in "${lines[@]}"; do
            idx=$((idx+1))
            slug=$(slugify "$line")
            [ -z "$slug" ] && continue
            post failure "p0/test-detail-$idx-$slug" "$slug"
          done
          post failure p0/tests-result "Vitest failed"
          exit "$code"
