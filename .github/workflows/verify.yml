name: verify

on:
  push:
    branches: [main]

permissions:
  statuses: write

jobs:
  diagnose-p0-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run core patch and publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          node scripts/apply-p0-handshake-fix.mjs core > /tmp/p0-core.log 2>&1
          code=$?
          set -e
          tail -n 20 /tmp/p0-core.log
          if [ "$code" -eq 0 ]; then
            state=success
            summary="core patch applied in checkout"
          else
            state=failure
            summary=$(tail -n 1 /tmp/p0-core.log | tr '\n\r' '  ' | cut -c1-130)
          fi
          payload=$(jq -n --arg state "$state" --arg context "p0/core-diagnostic" --arg description "$summary" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload" >/dev/null
          exit "$code"
