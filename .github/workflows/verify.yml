name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck, lint, test and validate build
        run: npm run verify
      - name: Publish verify commit status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERIFY_STATE: ${{ job.status }}
        run: |
          if [ "$VERIFY_STATE" = "success" ]; then
            state=success
            description="npm run verify passed (tests + build)"
          else
            state=failure
            description="npm run verify failed"
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"verify/npm\",\"description\":\"$description\"}"
