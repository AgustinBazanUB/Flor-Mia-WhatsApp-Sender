name: verify

on:
  push:
    branches: [main]

permissions:
  statuses: write

jobs:
  diagnose-p0-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Patch and report first TypeScript error
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          python3 scripts/apply-p0-text.py
          git show 95b65f2714a447e73051906ddf413a0f583d2ca9:.github/workflows/verify.yml > .github/workflows/verify.yml
          rm -f scripts/apply-p0-handshake-fix.mjs scripts/apply-p0-text.py .github/workflows/p0-handshake-fix.yml
          npm ci >/tmp/npm-ci.log 2>&1
          set +e
          npm run typecheck >/tmp/typecheck.log 2>&1
          code=$?
          set -e
          cat /tmp/typecheck.log
          if [ "$code" -eq 0 ]; then
            state=success
            summary=typecheck-passed
          else
            state=failure
            summary=$(grep -E 'error TS[0-9]+' /tmp/typecheck.log | head -n 1 || true)
            if [ -z "$summary" ]; then summary=$(tail -n 1 /tmp/typecheck.log); fi
            summary=$(printf '%s' "$summary" | tr ' /,:()[]`"' '------------' | tr -cd 'A-Za-z0-9_.-' | cut -c1-110)
          fi
          context="p0/typecheck-$summary"
          payload=$(jq -n --arg state "$state" --arg context "$context" --arg description "$summary" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload" >/dev/null
          exit "$code"
