name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  statuses: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify
        run: npm run verify

  diagnose-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Vitest with machine-readable output
        id: tests
        run: npm run test -- --reporter=json --outputFile=/tmp/vitest.json
      - name: Publish test diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            state=success
            description="Vitest: success"
          else
            state=failure
            failing=$(node -e 'const fs=require("fs"); try { const r=JSON.parse(fs.readFileSync("/tmp/vitest.json","utf8")); const names=(r.testResults||[]).filter(x=>x.status==="failed").map(x=>String(x.name||"").split("/").pop()).filter(Boolean).slice(0,2); process.stdout.write(names.join(",")||"unknown"); } catch { process.stdout.write("unknown"); }')
            description="Vitest: $failing"
          fi
          description=$(printf '%s' "$description" | cut -c1-135)
          payload=$(jq -n --arg state "$state" --arg context "verify/tests-detail" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload"
