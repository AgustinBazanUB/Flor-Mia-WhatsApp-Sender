name: verify

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  publish-p0-handshake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply verified source and test patches
        run: |
          python3 scripts/apply-p0-text.py
          python3 scripts/fix-p0-test-tab-type.py
      - name: Commit lifecycle repair
        run: |
          git add src/background/whatsapp-transport.ts src/background/contact-adapter.ts src/background/service-worker.ts src/compatibility/types.ts src/whatsapp/preflight.ts src/engine/retry-policy.ts
          git commit -m "fix: synchronize WhatsApp post-navigation handshake"
      - name: Commit lifecycle regression coverage
        run: |
          git add tests/contact-adapter-binding.test.ts tests/post-navigation-handshake.test.ts
          git commit -m "test: cover post-navigation content lifecycle"
      - name: Commit release metadata
        run: |
          git add manifest.json package.json package-lock.json
          git commit -m "chore: release 0.9.4.1"
      - name: Restore normal CI and remove one-shot helpers
        run: |
          git show 95b65f2714a447e73051906ddf413a0f583d2ca9:.github/workflows/verify.yml > .github/workflows/verify.yml
          git rm scripts/apply-p0-handshake-fix.mjs scripts/apply-p0-text.py scripts/fix-p0-test-tab-type.py .github/workflows/p0-handshake-fix.yml
          git add .github/workflows/verify.yml
          git commit -m "chore: remove one-shot handshake repair helper"
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify final tree
        run: npm run verify
      - name: Confirm built extension version
        run: node -e 'const m=require("./dist/manifest.json"); if(m.version!=="0.9.4.1"){console.error(`expected 0.9.4.1 got ${m.version}`);process.exit(1)}; console.log(`dist version=${m.version}`)'
      - name: Push verified commits to main
        run: git push origin HEAD:main
