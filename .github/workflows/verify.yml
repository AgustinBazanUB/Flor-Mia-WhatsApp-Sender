name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write
  statuses: write

jobs:
  apply-p0-handshake:
    if: github.event_name == 'push' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply, verify and publish P0 repair
        shell: bash
        run: |
          set +e
          {
            node scripts/apply-p0-handshake-fix.mjs core &&
            git add src/background/whatsapp-transport.ts src/background/contact-adapter.ts src/background/service-worker.ts src/compatibility/types.ts src/whatsapp/preflight.ts src/engine/retry-policy.ts &&
            git commit -m "fix: synchronize WhatsApp post-navigation handshake" &&
            node scripts/apply-p0-handshake-fix.mjs tests &&
            git add tests/contact-adapter-binding.test.ts tests/post-navigation-handshake.test.ts &&
            git commit -m "test: cover post-navigation content lifecycle" &&
            node scripts/apply-p0-handshake-fix.mjs version &&
            git add manifest.json package.json package-lock.json &&
            git commit -m "chore: release 0.9.4.1" &&
            git rm scripts/apply-p0-handshake-fix.mjs .github/workflows/p0-handshake-fix.yml &&
            git show "$GITHUB_SHA^:.github/workflows/verify.yml" > .github/workflows/verify.yml &&
            git add .github/workflows/verify.yml &&
            git commit -m "chore: remove one-shot handshake repair helper" &&
            npm ci &&
            npm run verify &&
            node -e 'const m=require("./dist/manifest.json"); if(m.version!=="0.9.4.1") { console.error(m.version); process.exit(1) } console.log(`dist version=${m.version}`)'
          } > /tmp/p0-handshake.log 2>&1
          result=$?
          set -e
          cat /tmp/p0-handshake.log
          if [ "$result" -ne 0 ]; then
            git reset --hard "$GITHUB_SHA"
            cp /tmp/p0-handshake.log p0-verify-failure.log
            git add p0-verify-failure.log
            git commit -m "diag: capture P0 handshake verify failure"
            git push origin HEAD:main
            exit "$result"
          fi
          git push origin HEAD:main

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify
        id: verify
        run: npm run verify
      - name: Publish aggregate verify status
        if: always() && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          if [ "$VERIFY_OUTCOME" = "success" ]; then state=success; else state=failure; fi
          description="npm run verify: $VERIFY_OUTCOME"
          payload=$(jq -n --arg state "$state" --arg context "verify/npm" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload"

  diagnose-verify-phase:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Lint
        id: lint
        run: npm run lint
      - name: Tests
        id: tests
        run: npm test
      - name: Build
        id: build
        run: npm run build
      - name: Validate build
        id: validate
        run: npm run validate:build
      - name: Publish verification phase status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TYPECHECK_OUTCOME: ${{ steps.typecheck.outcome }}
          LINT_OUTCOME: ${{ steps.lint.outcome }}
          TESTS_OUTCOME: ${{ steps.tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
        shell: bash
        run: |
          outcomes="typecheck=$TYPECHECK_OUTCOME lint=$LINT_OUTCOME tests=$TESTS_OUTCOME build=$BUILD_OUTCOME validate=$VALIDATE_OUTCOME"
          state=failure
          phase=unknown
          if [ "$TYPECHECK_OUTCOME" = "failure" ]; then
            phase=typecheck
          elif [ "$LINT_OUTCOME" = "failure" ]; then
            phase=lint
          elif [ "$TESTS_OUTCOME" = "failure" ]; then
            phase=tests
          elif [ "$BUILD_OUTCOME" = "failure" ]; then
            phase=build
          elif [ "$VALIDATE_OUTCOME" = "failure" ]; then
            phase=validate-build
          elif [ "$TYPECHECK_OUTCOME" = "success" ] && [ "$LINT_OUTCOME" = "success" ] && [ "$TESTS_OUTCOME" = "success" ] && [ "$BUILD_OUTCOME" = "success" ] && [ "$VALIDATE_OUTCOME" = "success" ]; then
            state=success
            phase=success
          fi
          description=$(printf '%s' "$outcomes" | cut -c1-135)
          context="verify/phase-$phase"
          payload=$(jq -n --arg state "$state" --arg context "$context" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload"

  diagnose-lint:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Capture ESLint JSON
        shell: bash
        run: npm run lint -- --format=json --output-file=/tmp/eslint.json || true
      - name: Publish first lint violation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          summary=$(node -e 'const fs=require("fs"), path=require("path"); const r=JSON.parse(fs.readFileSync("/tmp/eslint.json","utf8")); const f=r.find(x=>(x.errorCount||0)>0); if(!f){process.stdout.write("success");process.exit(0)} const m=f.messages.find(x=>x.severity===2)||{}; const file=path.basename(f.filePath||"unknown").replace(/[^A-Za-z0-9_.-]/g,"-"); const rule=String(m.ruleId||"unknown").replace(/[^A-Za-z0-9_.-]/g,"-"); process.stdout.write(`${file}-${rule}`)')
          if [ "$summary" = "success" ]; then state=success; else state=failure; fi
          context="verify/lint-$summary"
          payload=$(jq -n --arg state "$state" --arg context "$context" --arg description "First ESLint result: $summary" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload"

  diagnose-tests:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run Vitest with machine-readable output
        id: tests
        run: npm run test -- --reporter=json --outputFile=/tmp/vitest.json
      - name: Publish test diagnostic status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          TEST_OUTCOME: ${{ steps.tests.outcome }}
        shell: bash
        run: |
          if [ "$TEST_OUTCOME" = "success" ]; then
            state=success
            failing=success
            description="Vitest: success"
          else
            state=failure
            failing=$(node -e 'const fs=require("fs"); try { const r=JSON.parse(fs.readFileSync("/tmp/vitest.json","utf8")); const assertions=(r.testResults||[]).flatMap(t=>(t.assertionResults||[]).filter(a=>a.status==="failed").map(a=>String(a.fullName||[...(a.ancestorTitles||[]),a.title].filter(Boolean).join(" ")))); const names=assertions.filter(Boolean).slice(0,2); process.stdout.write(names.join(" | ")||"unknown"); } catch { process.stdout.write("unknown"); }')
            description="Vitest: $failing"
          fi
          failing_slug=$(printf '%s' "$failing" | tr ' /,.|:()' '----------' | tr -cd 'A-Za-z0-9_-' | cut -c1-85)
          description=$(printf '%s' "$description" | cut -c1-135)
          context="verify/tests-$failing_slug"
          payload=$(jq -n --arg state "$state" --arg context "$context" --arg description "$description" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload"
