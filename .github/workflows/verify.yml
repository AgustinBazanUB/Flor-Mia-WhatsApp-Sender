name: verify

on:
  push:
    branches: [main]

permissions:
  statuses: write

jobs:
  diagnose-p0-core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Run core patch and publish diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set +e
          node scripts/apply-p0-handshake-fix.mjs core > /tmp/p0-core.log 2>&1
          code=$?
          set -e
          cat /tmp/p0-core.log
          if [ "$code" -eq 0 ]; then
            state=success
            summary="core-patch-applied"
          else
            state=failure
            raw_location=$(grep -E 'apply-p0-handshake-fix\.mjs:[0-9]+' /tmp/p0-core.log | head -n 1 || true)
            line=$(printf '%s' "$raw_location" | sed -E 's#.*apply-p0-handshake-fix\.mjs:([0-9]+).*#line-\1#')
            error=$(grep -E 'No se encontró|SyntaxError:|Error:' /tmp/p0-core.log | head -n 1 || true)
            error=$(printf '%s' "$error" | tr ' /,:()[]`"' '------------' | tr -cd 'A-Za-z0-9_.-' | cut -c1-75)
            summary="$line-$error"
          fi
          context="p0/core-$summary"
          payload=$(jq -n --arg state "$state" --arg context "$context" --arg description "$summary" '{state:$state,context:$context,description:$description}')
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
            --data "$payload" >/dev/null
          exit "$code"
