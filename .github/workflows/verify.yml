name: verify

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-verify-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current main
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Apply, clean, verify and publish
        shell: bash
        run: |
          set +e
          {
            python3 scripts/apply-p0-text.py &&
            git add src/background/whatsapp-transport.ts src/background/contact-adapter.ts src/background/service-worker.ts src/compatibility/types.ts src/whatsapp/preflight.ts src/engine/retry-policy.ts &&
            git commit -m "fix: synchronize WhatsApp post-navigation handshake" &&
            git add tests/contact-adapter-binding.test.ts tests/post-navigation-handshake.test.ts &&
            git commit -m "test: cover post-navigation content lifecycle" &&
            git add manifest.json package.json package-lock.json &&
            git commit -m "chore: release 0.9.4.1" &&
            git show 95b65f2714a447e73051906ddf413a0f583d2ca9:.github/workflows/verify.yml > .github/workflows/verify.yml &&
            git rm scripts/apply-p0-handshake-fix.mjs scripts/apply-p0-text.py .github/workflows/p0-handshake-fix.yml &&
            git add .github/workflows/verify.yml &&
            git commit -m "chore: remove one-shot handshake repair helper" &&
            npm ci &&
            npm run verify &&
            node -e 'const m=require("./dist/manifest.json"); if(m.version!=="0.9.4.1"){console.error(`unexpected dist version ${m.version}`);process.exit(1)}; console.log(`dist version=${m.version}`)'
          } > /tmp/p0-final.log 2>&1
          result=$?
          set -e
          cat /tmp/p0-final.log
          if [ "$result" -ne 0 ]; then
            git reset --hard "$GITHUB_SHA"
            cp /tmp/p0-final.log p0-verify-failure.log
            git add p0-verify-failure.log
            git commit -m "diag: capture P0 final verify failure"
            git push origin HEAD:main
            exit "$result"
          fi
          git push origin HEAD:main
