name: verify

on:
  push:
    branches: [main]

permissions:
  contents: write
  statuses: write

jobs:
  publish-p0-product:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Publish verified product commits
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          post() {
            state="$1"; phase="$2"; desc="$3"
            payload=$(jq -n --arg state "$state" --arg context "p0/product-$phase" --arg description "$desc" '{state:$state,context:$context,description:$description}')
            curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPOSITORY/statuses/$COMMIT_SHA" \
              --data "$payload" >/dev/null
          }
          fail() {
            phase="$1"; code="$2"; detail="${3:-P0 product publish failed at $phase}"
            post failure "$phase" "$detail"
            exit "$code"
          }

          post pending start "P0 product publish started"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          python3 scripts/apply-p0-text.py || fail patch $?
          python3 scripts/fix-p0-test-tab-type.py || fail patch $?
          post success patch "Verified patch applied"

          git add src/background/whatsapp-transport.ts src/background/contact-adapter.ts src/background/service-worker.ts src/compatibility/types.ts src/whatsapp/preflight.ts src/engine/retry-policy.ts
          git commit -m "fix: synchronize WhatsApp post-navigation handshake" || fail commit-core $?
          git add tests/contact-adapter-binding.test.ts tests/post-navigation-handshake.test.ts
          git commit -m "test: cover post-navigation content lifecycle" || fail commit-tests $?
          git add manifest.json package.json package-lock.json
          git commit -m "chore: release 0.9.4.1" || fail commit-version $?
          post success commits "Logical product commits created"

          # Validate the exact product tree while removing diagnostic helpers only from the working tree.
          git show 95b65f2714a447e73051906ddf413a0f583d2ca9:.github/workflows/verify.yml > .github/workflows/verify.yml
          rm -f scripts/apply-p0-handshake-fix.mjs scripts/apply-p0-text.py scripts/fix-p0-test-tab-type.py .github/workflows/p0-handshake-fix.yml
          npm ci --no-audit --no-fund || fail npm-ci $?
          npm run verify || fail verify $?
          node -e 'const m=require("./dist/manifest.json"); if(m.version!=="0.9.4.1"){console.error(`expected 0.9.4.1 got ${m.version}`);process.exit(1)}' || fail dist-version $?
          post success verify "Product tree verify passed"

          set +e
          push_output=$(git push origin HEAD:main 2>&1)
          push_code=$?
          set -e
          echo "$push_output"
          if [ "$push_code" -ne 0 ]; then
            detail=$(printf '%s' "$push_output" | tail -n 2 | tr '\n\r' '  ' | cut -c1-130)
            fail push "$push_code" "$detail"
          fi
          post success push "Product commits pushed to main"
          post success start "P0 product publish completed"
