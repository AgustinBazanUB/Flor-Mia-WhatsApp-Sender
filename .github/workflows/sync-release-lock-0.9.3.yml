name: sync release lock 0.9.3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - name: Synchronize package-lock metadata
        shell: bash
        run: |
          node -e 'const p=require("./package.json"); if(p.version!=="0.9.3") throw new Error(`Unexpected package version ${p.version}`)'
          npm install --package-lock-only --ignore-scripts
          node -e 'const p=require("./package.json"), l=require("./package-lock.json"); if(l.version!==p.version || l.packages?.[""]?.version!==p.version) throw new Error("package-lock version did not synchronize")'
      - name: Commit lock only when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "release: sync package lock 0.9.3"
          git push origin HEAD:main
